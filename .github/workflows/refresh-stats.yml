name: Refresh GitHub stats

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-cache:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust Camo cache on stats images
        run: |
          TS=$(date -u +%Y%m%d%H)
          sed -i -E "s/cache_ts=[0-9]+/cache_ts=${TS}/g" README.md
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No cache_ts change"
            exit 0
          fi
          git commit -m "chore: refresh GitHub stats cache"
          git push
